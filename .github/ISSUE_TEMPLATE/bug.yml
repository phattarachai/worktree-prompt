name: Bug report
description: Something is broken.
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps, config, or code that shows the problem.
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
    validations:
      required: true

  - type: input
    id: git-version
    attributes:
      label: git version and OS
      placeholder: git 2.54, macOS 26 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Stack trace or console output, if any. Rendered as code, no backticks needed.
      render: text
